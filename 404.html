<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<meta name="robots" content="noindex">
<title>404 — NCLR</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #050505;
    --ink: #f5f5f5;
    --ink-2: #bdbdbd;
    --muted: #8a8a8a;
    --line: rgba(255, 255, 255, 0.14);
    --mono: "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, monospace;
    --sans: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #fbfbf9;
      --ink: #0a0a0a;
      --ink-2: #2a2a2a;
      --muted: #5f5f5f;
      --line: rgba(0, 0, 0, 0.14);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 28px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.7;
  }
  .panel { width: min(560px, 100%); }
  .mark {
    display: grid;
    place-items: center;
    width: 36px;
    height: 36px;
    margin-bottom: 48px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: #ffffff;
    color: var(--bg);
    overflow: hidden;
  }
  .mark img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .code {
    margin: 0 0 14px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  h1 {
    margin: 0;
    font-size: clamp(2.2rem, 5vw, 3.4rem);
    line-height: 1.08;
    letter-spacing: -0.04em;
  }
  .copy {
    margin: 18px 0 0;
    max-width: 42ch;
    font-size: 14px;
    color: var(--ink-2);
  }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 30px;
    padding-bottom: 3px;
    border-bottom: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink);
    text-decoration: none;
  }
  .back:hover { border-bottom-color: var(--ink); }
  .hint {
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--muted);
  }
</style>
</head>
<body>
<main class="panel">
  <div class="mark" aria-hidden="true">
    <img src="assets/img/nclr-icon-64.png" alt="" width="36" height="36">
  </div>
  <p class="code">404 / NOT FOUND</p>
  <h1>页面不存在。</h1>
  <p class="copy">地址可能拼错了，或者页面已经移动。回到项目首页继续。</p>
  <a class="back" href="./">返回 NCLR 首页 <span aria-hidden="true">→</span></a>
  <p class="hint">项目页使用项目路径；如果页面没有自动返回，点上面的链接。</p>
</main>
<script>
  (function () {
    var segments = location.pathname.split("/").filter(Boolean);
    function probe(depth) {
      if (depth < 0) { location.replace("/"); return; }
      var prefix = "/" + segments.slice(0, depth).join("/") + (depth ? "/" : "");
      fetch(prefix + "index.html", { method: "HEAD", cache: "no-store" })
        .then(function (response) {
          if (response.ok) location.replace(prefix + location.hash);
          else probe(depth - 1);
        })
        .catch(function () { probe(depth - 1); });
    }
    probe(segments.length);
  })();
</script>
</body>
</html>
