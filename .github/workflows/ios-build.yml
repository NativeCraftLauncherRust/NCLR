name: nclr-build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          targets: aarch64-apple-ios, wasm32-unknown-unknown
      - name: Prepare Horizon
        env:
          HORIZON_DIR: ${{ runner.temp }}/horizon
        run: bash scripts/prepare-horizon.sh
      - name: Build iOS static library
        env:
          HORIZON_DIR: ${{ runner.temp }}/horizon
        run: |
          set -euxo pipefail
          cd "$HORIZON_DIR"
          IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            cargo build -p horizon-ios --target aarch64-apple-ios --profile fast
      # The std member must be built by the same toolchain as the mods. The
      # checked-in copy matches the 1.100.0-generated core symbols; rebuilding
      # it here with another rustc produces a different core hash and wasm mods
      # fail to link with "which no earlier member has".
      - name: Package NCLR
        env:
          HORIZON_DIR: ${{ runner.temp }}/horizon
        run: |
          set -euxo pipefail
          BUILD_NUMBER="$(TZ=Asia/Shanghai date +%Y%m%d%H%M)" \
          HORIZON_DIR="$HORIZON_DIR" PROFILE=fast \
            APP_NAME=NCLR \
            MAIN_SOURCE="$PWD/ios/main_l1.m" \
            INFO_PLIST="$PWD/ios/Info-launcher.plist" \
            BUNDLE_ID=dev.zrxmaxlnx.nclr \
            IPA_NAME=NCLR-L10.6-unsigned.ipa \
            ICON_DIR="$PWD/ios/icons" \
            RESOURCE_DIR="" SHIP_BUNDLE="" \
            WASM_STD_DIR="$PWD/ios/wasm-std" \
            BUILD_DIR="$PWD/build-nclr" DIST_DIR="$PWD/dist-nclr" \
            bash ios/build.sh
      # The 3D backpack mod: a wasm code mod built by the same pinned toolchain the
      # game's std member is built with, packed into mods/threed_backpack.
      - name: Build the 3D backpack mod
        env:
          HORIZON_DIR: ${{ runner.temp }}/horizon
        run: |
          set -euxo pipefail
          cd "$HORIZON_DIR"
          cargo build --profile fast -p cargo-horizon-mod
          mkdir -p "$HORIZON_DIR/mods"
          rm -rf "$HORIZON_DIR/mods/threed_backpack"
          cp -R "$GITHUB_WORKSPACE/mods/threed_backpack" "$HORIZON_DIR/mods/"
          cd "$HORIZON_DIR/mods/threed_backpack"
          "$HORIZON_DIR/target/fast/cargo-horizon-mod" build --wasm
      - uses: actions/upload-artifact@v4
        with:
          name: threed-backpack-hmod
          path: ${{ runner.temp }}/horizon/mods/threed_backpack/*.hmod
          if-no-files-found: error
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NCLR-unsigned
          path: dist-nclr/*.ipa
          if-no-files-found: error
