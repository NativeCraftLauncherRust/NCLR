name: nclr-build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          targets: aarch64-apple-ios, wasm32-unknown-unknown
      - name: Prepare Horizon
        env:
          HORIZON_DIR: ${{ runner.temp }}/horizon
        run: bash scripts/prepare-horizon.sh
      - name: Build iOS static library
        env:
          HORIZON_DIR: ${{ runner.temp }}/horizon
        run: |
          set -euxo pipefail
          cd "$HORIZON_DIR"
          IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            cargo build -p horizon-ios --target aarch64-apple-ios --profile fast
      - name: Build wasm standard library
        env:
          HORIZON_DIR: ${{ runner.temp }}/horizon
        run: |
          set -euxo pipefail
          cd "$HORIZON_DIR"
          cargo run --locked -p cargo-horizon-mod -- wasm-std "$GITHUB_WORKSPACE/horizon-wasm-std.wasm"
          ls -lh "$GITHUB_WORKSPACE/horizon-wasm-std.wasm"
      - name: Package NCLR
        env:
          HORIZON_DIR: ${{ runner.temp }}/horizon
        run: |
          set -euxo pipefail
          HORIZON_DIR="$HORIZON_DIR" PROFILE=fast \
            APP_NAME=NCLR \
            MAIN_SOURCE="$PWD/ios/main_l1.m" \
            INFO_PLIST="$PWD/ios/Info-launcher.plist" \
            BUNDLE_ID=dev.zrxmaxlnx.nclr \
            IPA_NAME=NCLR-L1.1-unsigned.ipa \
            ICON_DIR="$PWD/ios/icons" \
            RESOURCE_DIR="" SHIP_BUNDLE="" \
            WASM_STD="$PWD/horizon-wasm-std.wasm" \
            BUILD_DIR="$PWD/build-nclr" DIST_DIR="$PWD/dist-nclr" \
            bash ios/build.sh
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NCLR-unsigned
          path: dist-nclr/*.ipa
          if-no-files-found: error
