name: mod-build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mod:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HORIZON_DIR: ${{ runner.temp }}/horizon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - name: Prepare Horizon
        run: bash scripts/prepare-horizon.sh
      # The mod tool builds each .hmod against the pinned toolchain, which it
      # installs with rust-src the first time.
      - name: Build cargo-horizon-mod
        run: |
          set -euxo pipefail
          cd "$HORIZON_DIR"
          cargo build --profile fast -p cargo-horizon-mod
      - name: Build 3D Backpack
        run: |
          set -euxo pipefail
          mkdir -p "$HORIZON_DIR/mods"
          rm -rf "$HORIZON_DIR/mods/threed_backpack"
          cp -R "$PWD/mods/threed_backpack" "$HORIZON_DIR/mods/"
          cd "$HORIZON_DIR/mods/threed_backpack"
          "$HORIZON_DIR/target/fast/cargo-horizon-mod" build --wasm
      - name: Upload the .hmod
        uses: actions/upload-artifact@v4
        with:
          name: threed-backpack-hmod
          path: ${{ runner.temp }}/horizon/mods/threed_backpack/*.hmod
          if-no-files-found: error
