[package]
name = "hzr-pack"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Packs prepared Horizon resources into one verifiable archive (route3, isolated from the horizon workspace)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"

# Standalone: never absorbed into a parent workspace.
[workspace]
