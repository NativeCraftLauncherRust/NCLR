[package]
name = "hzr-fetch"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Derives assets/, data/ and worldgen/ on device from the player's own Minecraft (route3)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[workspace]
